name: Harbor-UAT-CI-CD

on:
  push:
    branches:
      - 'release/**'

jobs:
  Build-Push-Harbor:
    environment: uat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Declare some variables
        id: vars
        shell: bash
        run: |
          echo "branch=$(echo ${GITHUB_REF#refs/heads/} | sed "s/\\//-/g")" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_name=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')" >> $GITHUB_OUTPUT

      - name: Print Branch Details
        run: |
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "Sha: ${{ steps.vars.outputs.sha_short }}"
          echo "Repo: ${{ steps.vars.outputs.repo_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Copy env file
        run: aws s3 cp s3://${{ secrets.ONPREM_ENV_FILE_BUCKET_PATH }}/.env ./.env

      - name: Extract ORIGIN from env file
        run: |
          ORIGIN=$(grep '^ORIGIN=' ./.env | cut -d= -f2-)
          echo "ORIGIN=$ORIGIN" >> "$GITHUB_ENV"

      - name: Copy constant file
        run: aws s3 cp s3://${{ secrets.ONPREM_CONSTANT_FILE_BUCKET_PATH }}/constants.ts ./src/lib

      - name: Copy favicon file
        run: aws s3 cp s3://${{ secrets.ONPREM_FAVICON_FILE_BUCKET }}/favicon.png ./static/favicon.png

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
              ORIGIN=${{ env.ORIGIN }}
              ENVIRONMENT=uat
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/rean-admin-portal:sb.${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      # Mirror the freshly-pushed ECR image into Harbor (Harbor PULLS it, so no
      # slow upload) and keep only the 5 latest. continue-on-error so a Harbor
      # hiccup never blocks the pipeline.
      - name: Mirror image to Harbor (keep 5 latest)
        continue-on-error: true
        shell: bash
        env:
          HARBOR: https://artifacts.reanfoundation.org
          HARBOR_ROBOT: ${{ secrets.HARBOR_ROBOT }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
          ECR_REPO: rean-admin-portal
          TAG: sb.${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}
          HARBOR_PROJECT: rean-dev
          ECR_REGISTRY_ID: "1"
          RETENTION_ID: "2"
        run: |
          set -euo pipefail
          A=(-u "${HARBOR_ROBOT}:${HARBOR_ROBOT_SECRET}")
          POL="ci-${ECR_REPO}"
          BODY="{\"name\":\"${POL}\",\"src_registry\":{\"id\":${ECR_REGISTRY_ID}},\"dest_namespace\":\"${HARBOR_PROJECT}\",\"dest_namespace_replace_count\":0,\"trigger\":{\"type\":\"manual\"},\"filters\":[{\"type\":\"name\",\"value\":\"${ECR_REPO}\"},{\"type\":\"tag\",\"value\":\"${TAG}\"}],\"enabled\":true,\"override\":true,\"speed\":-1}"
          # find-or-create this repo's pull policy, pinned to the exact tag we just pushed
          PID=$(curl -sk "${A[@]}" "${HARBOR}/api/v2.0/replication/policies?q=name%3D${POL}" | jq -r '.[0].id // empty')
          if [ -z "$PID" ]; then
            PID=$(curl -sk "${A[@]}" -X POST -H 'Content-Type: application/json' -d "$BODY" -D - -o /dev/null "${HARBOR}/api/v2.0/replication/policies" | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r' | awk -F/ '{print $NF}')
          else
            curl -sk "${A[@]}" -X PUT -H 'Content-Type: application/json' -d "$BODY" "${HARBOR}/api/v2.0/replication/policies/${PID}"
          fi
          echo "Harbor pull policy id: $PID"
          # trigger Harbor to pull ONLY this tag, then wait for it to actually finish
          EX=$(curl -sk "${A[@]}" -X POST -H 'Content-Type: application/json' -d "{\"policy_id\":${PID}}" -D - -o /dev/null "${HARBOR}/api/v2.0/replication/executions" | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r' | awk -F/ '{print $NF}')
          echo "Harbor replication execution id: $EX"
          OK=0
          ST=unknown
          # poll up to 90 min - large images over a long-haul link can take >60 min
          for i in $(seq 1 1080); do
            ST=$(curl -sk "${A[@]}" "${HARBOR}/api/v2.0/replication/executions/${EX}" | jq -r .status)
            [ $((i % 12)) -eq 1 ] && echo "  replication: $ST"
            [ "$ST" = "Succeed" ] && { OK=1; break; }
            [ "$ST" = "Failed" ] && { echo "::error::Harbor replication FAILED (execution ${EX})"; exit 1; }
            [ "$ST" = "Stopped" ] && { echo "::error::Harbor replication was STOPPED (execution ${EX})"; exit 1; }
            sleep 5
          done
          # do not claim success on a timeout - the old version printed "Mirrored"
          # unconditionally after the loop, which hid real failures
          if [ "$OK" != "1" ]; then
            echo "::error::Harbor replication did not finish in time (last status: ${ST}, execution ${EX})"
            exit 1
          fi
          # only prune once the new image is definitely in Harbor
          curl -sk "${A[@]}" -X POST -H 'Content-Type: application/json' -d '{"dry_run":false}' "${HARBOR}/api/v2.0/retentions/${RETENTION_ID}/executions"
          echo "Mirrored ${ECR_REPO}:${TAG} to Harbor (${HARBOR_PROJECT}); triggered keep-5."
